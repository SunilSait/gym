<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your IronPeak Gym account. Start your 7-day free trial today — no credit card required.">
    <title>Create Account | IronPeak Gym & Fitness</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#E8401C', secondary: '#1A1A2E' } } } }</script>
</head>
<body class="min-h-screen bg-gradient-mesh flex items-center justify-center overflow-x-hidden relative text-[#0f0f1a] dark:text-[#f0f0ff]">

    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?w=1600&q=60&fit=crop" alt="" class="w-full h-full object-cover opacity-5 dark:opacity-10">
    </div>
    <div class="bg-orb w-80 h-80 bg-[#E8401C]" style="top:-10%;right:-5%;z-index:1;"></div>
    <div class="bg-orb w-64 h-64 bg-[#1A1A2E]" style="bottom:-10%;left:-5%;z-index:1;opacity:0.1;animation-delay:3s;"></div>

    <!-- Top Bar -->
    <div class="flex items-center justify-end p-4 sm:p-6 w-full absolute top-0 left-0 z-50">
        <div class="flex items-center gap-2">
            <button id="signup-dir-btn" onclick="toggleDir()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-[#1A1A2E]/10 dark:bg-white/10 border border-[#1A1A2E]/15 dark:border-white/15 text-[#1A1A2E]/70 dark:text-white/60 hover:text-[#E8401C] transition-all text-[10px] font-black">LTR</button>
            <button onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-[#1A1A2E]/10 dark:bg-white/10 border border-[#1A1A2E]/15 dark:border-white/15 text-[#1A1A2E]/70 dark:text-white/60 hover:text-[#E8401C] transition-all" aria-label="Toggle theme">
                <span id="signup-theme-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
            </button>
        </div>
    </div>

    <!-- Card -->
    <div class="relative z-10 w-full max-w-md mx-auto px-4 py-20">
        <div class="bg-white dark:bg-[#13132a] border border-[#e2e2ef] dark:border-[#252545] rounded-3xl p-8 shadow-2xl">

            <!-- Logo -->
            <a href="index.html" class="flex items-center gap-2.5 mb-8 logo-bounce" aria-label="IronPeak Home">
                <div class="w-10 h-10 bg-[#E8401C] rounded-xl flex items-center justify-center shadow-md shrink-0">
                    <svg width="22" height="22" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="10" y="42" width="80" height="16" rx="4" fill="white" opacity="0.95"/>
                        <rect x="6" y="28" width="16" height="44" rx="5" fill="white" opacity="0.9"/>
                        <rect x="78" y="28" width="16" height="44" rx="5" fill="white" opacity="0.9"/>
                        <rect x="0" y="35" width="10" height="30" rx="4" fill="white" opacity="0.7"/>
                        <rect x="90" y="35" width="10" height="30" rx="4" fill="white" opacity="0.7"/>
                    </svg>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="font-black text-[#1A1A2E] dark:text-white text-base tracking-tight" style="font-family:'Barlow Condensed',sans-serif;">IRON<span class="text-[#E8401C]">PEAK</span></span>
                    <span class="font-semibold text-[#5a5a7a] dark:text-[#9090b8] text-[10px] tracking-widest uppercase">Gym & Fitness</span>
                </div>
            </a>

            <h1 class="text-3xl font-black text-[#1A1A2E] dark:text-white mb-1" style="font-family:'Barlow Condensed',sans-serif;">Start Free Trial</h1>
            <p class="text-[#5a5a7a] dark:text-[#9090b8] text-sm mb-7">7 days free. No credit card required. Join 2,400+ members today.</p>

            <!-- Social Sign Up -->
            <div class="grid grid-cols-3 gap-3 mb-6">
                <button class="flex items-center justify-center gap-2 w-full py-3 border border-[#e2e2ef] dark:border-[#252545] rounded-xl hover:bg-[#f7f7fc] dark:hover:bg-[#1a1a35] transition-all font-semibold text-xs text-[#1A1A2E] dark:text-white">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google
                </button>
                <button class="flex items-center justify-center gap-2 w-full py-3 border border-[#e2e2ef] dark:border-[#252545] rounded-xl hover:bg-[#f7f7fc] dark:hover:bg-[#1a1a35] transition-all font-semibold text-xs text-[#1A1A2E] dark:text-white">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                    Apple
                </button>
                <button class="flex items-center justify-center gap-2 w-full py-3 border border-[#e2e2ef] dark:border-[#252545] rounded-xl hover:bg-[#f7f7fc] dark:hover:bg-[#1a1a35] transition-all font-semibold text-xs text-[#1A1A2E] dark:text-white">
                    <svg width="16" height="16" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Meta
                </button>
            </div>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-px bg-[#e2e2ef] dark:bg-[#252545] flex-1"></div>
                <span class="text-[#5a5a7a] dark:text-[#9090b8] text-xs font-medium">or sign up with email</span>
                <div class="h-px bg-[#e2e2ef] dark:bg-[#252545] flex-1"></div>
            </div>

            <!-- Form -->
            <form onsubmit="event.preventDefault(); window.location.href='dashboard/index.html';">
                <div class="mb-4">
                    <label for="signup-first" class="block text-xs font-bold text-[#1A1A2E] dark:text-white uppercase tracking-wider mb-2">First Name *</label>
                    <input type="text" id="signup-first" class="form-input" placeholder="John" required>
                </div>
                <div class="mb-4">
                    <label for="signup-last" class="block text-xs font-bold text-[#1A1A2E] dark:text-white uppercase tracking-wider mb-2">Last Name *</label>
                    <input type="text" id="signup-last" class="form-input" placeholder="Doe" required>
                </div>
                <div class="mb-4">
                    <label for="signup-email" class="block text-xs font-bold text-[#1A1A2E] dark:text-white uppercase tracking-wider mb-2">Email Address *</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="john@example.com" required>
                </div>
                <div class="mb-4">
                    <label for="signup-phone" class="block text-xs font-bold text-[#1A1A2E] dark:text-white uppercase tracking-wider mb-2">Phone Number *</label>
                    <input type="tel" id="signup-phone" class="form-input" placeholder="+1 (555) 000-0000" required>
                </div>
                <div class="mb-4">
                    <label for="signup-password" class="block text-xs font-bold text-[#1A1A2E] dark:text-white uppercase tracking-wider mb-2">Password *</label>
                    <div class="relative">
                        <input type="password" id="signup-password" class="form-input pe-11" placeholder="Min. 8 characters" required minlength="8">
                        <button type="button" onclick="togglePwd('signup-password','signup-eye')" class="absolute end-4 top-1/2 -translate-y-1/2 text-[#5a5a7a] dark:text-[#9090b8] hover:text-[#E8401C] transition-colors">
                            <span id="signup-eye"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                        </button>
                    </div>
                </div>
                <div class="mb-6">
                    <label for="signup-confirm" class="block text-xs font-bold text-[#1A1A2E] dark:text-white uppercase tracking-wider mb-2">Confirm Password *</label>
                    <div class="relative">
                        <input type="password" id="signup-confirm" class="form-input pe-11" placeholder="Repeat password" required>
                        <button type="button" onclick="togglePwd('signup-confirm','signup-eye2')" class="absolute end-4 top-1/2 -translate-y-1/2 text-[#5a5a7a] dark:text-[#9090b8] hover:text-[#E8401C] transition-colors">
                            <span id="signup-eye2"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
                        </button>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="flex items-start gap-2 cursor-pointer">
                        <input type="checkbox" id="agree-terms" class="w-4 h-4 accent-[#E8401C] rounded mt-0.5 shrink-0" required>
                        <span class="text-xs text-[#5a5a7a] dark:text-[#9090b8] leading-relaxed">I agree to the <a href="#" class="text-[#E8401C] font-bold hover:underline">Terms of Service</a> and <a href="#" class="text-[#E8401C] font-bold hover:underline">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-primary w-full py-4 text-base">
                    Create Account — Start Free Trial
                </button>
            </form>

            <p class="text-center text-sm text-[#5a5a7a] dark:text-[#9090b8] mt-6">
                Already have an account?
                <a href="login.html" class="text-[#E8401C] font-bold hover:underline ml-1">Sign In →</a>
            </p>
        </div>
    </div>

<script src="components.js"></script>
<script>
    if (localStorage.getItem('gym_theme') === 'dark' || (!localStorage.getItem('gym_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }
    if (localStorage.getItem('gym_dir') === 'rtl') {
        document.documentElement.setAttribute('dir', 'rtl');
        const d = document.getElementById('signup-dir-btn');
        if (d) d.textContent = 'RTL';
    }
</script>
</body>
</html>
